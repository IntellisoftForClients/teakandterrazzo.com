services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: teak
      POSTGRES_PASSWORD: teaksecret
      POSTGRES_DB: teak_terrazzo
    ports:
      - "55432:5432"
    volumes:
      - teak_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U teak -d teak_terrazzo"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://teak:teaksecret@db:5432/teak_terrazzo?schema=public
      SESSION_SECRET: teak-terrazzo-compose-session-secret
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@example.com}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-change-me}
      PORT: 3000
      NODE_ENV: production
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./public/uploads:/app/public/uploads

volumes:
  teak_pg_data:
